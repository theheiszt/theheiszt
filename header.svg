<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Vibrant Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Wave Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.5px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background rounded rect -->
  <rect width="850" height="180" rx="16" fill="url(#bg-grad)"/>
  <rect width="848" height="178" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Decorative Waves -->
  <path d="M 0,140 Q 200,90 425,130 T 850,110 L 850,180 L 0,180 Z" fill="url(#wave1)"/>
  <path d="M 0,155 Q 220,120 425,145 T 850,135 L 850,180 L 0,180 Z" fill="url(#wave2)"/>

  <!-- Subtle grid dots pattern -->
  <g fill="#475569" opacity="0.2">
    <circle cx="40" cy="30" r="1.5"/>
    <circle cx="65" cy="30" r="1.5"/>
    <circle cx="90" cy="30" r="1.5"/>
    <circle cx="40" cy="55" r="1.5"/>
    <circle cx="65" cy="55" r="1.5"/>
    <circle cx="90" cy="55" r="1.5"/>
    <circle cx="40" cy="80" r="1.5"/>
    <circle cx="65" cy="80" r="1.5"/>
    <circle cx="90" cy="80" r="1.5"/>
    
    <circle cx="760" cy="30" r="1.5"/>
    <circle cx="785" cy="30" r="1.5"/>
    <circle cx="810" cy="30" r="1.5"/>
    <circle cx="760" cy="55" r="1.5"/>
    <circle cx="785" cy="55" r="1.5"/>
    <circle cx="810" cy="55" r="1.5"/>
    <circle cx="760" cy="80" r="1.5"/>
    <circle cx="785" cy="80" r="1.5"/>
    <circle cx="810" cy="80" r="1.5"/>
  </g>

  <!-- Status pill -->
  <g transform="translate(330, 24)">
    <rect width="190" height="22" rx="11" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="11" r="4" fill="#10b981"/>
    <text x="26" y="15" class="badge-text" fill="#cbd5e1">OPEN FOR OPPORTUNITIES</text>
  </g>

  <!-- Title Text -->
  <text x="425" y="90" text-anchor="middle" class="title" fill="url(#text-grad)">Andrew | @theheiszt</text>

  <!-- Subtitle Text -->
  <text x="425" y="122" text-anchor="middle" class="subtitle">Full-Stack Engineer  •  Web Dev  •  AI Systems &amp; MCP Architect</text>
</svg>
